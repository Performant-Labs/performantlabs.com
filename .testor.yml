# We make use of config substitusion, #see https://github.com/consolidation/config?tab=readme-ov-file#configuration-value-substitution
# Use `echo "s3_secret: $MY_SUPER_SECRET" >> .testor.yml` in your scripts.
pantheon:
  site: 'performant-labs'
tugboat:
  repo: '63fe5557d5af549afd35a86a'
s3:
  # Garage (self-hosted, Jupiter) — replaces the old Linode Object Storage
  # config. Same substitution pattern: the secret is never committed, only
  # `s3_secret` supplied at runtime (.testor_secret.yml or ROBO_S3_SECRET).
  # Endpoint is Jupiter's stable Tailscale address, reachable both from an
  # operator's own machine (running snapshot:refresh) and from Flotilla's
  # preview build containers on Jupiter itself (running snapshot:restore).
  config:
    version: 'latest'
    region: 'garage'
    endpoint: 'http://100.90.193.127:3900'
    credentials:
      key: 'GK84a0b14fd8a3afad8e643b29'
      secret: '${s3_secret}'
  bucket: 'flotilla-performantlabs-com'

# ── Producer sanitization (testor#27 snapshot:refresh -> DbSanitize) ───────────
# DbSanitize is a NO-OP unless `sanitize.command` is set: with no command it
# prints "Skip sanitization, because sanitize.command is not set" and passes.
# Without this key, a `snapshot:refresh` run for this repo would push an
# UNSANITIZED prod dump to the bucket — exactly the failure the consumer story
# (#314) must not silently depend on. Drupal's core `drush sql:sanitize`
# scrubs every user email/password to a deterministic, non-deliverable form
# (user+<uid>@example.com) and randomizes passwords; `--sanitize-password` and
# `--allowlist-fields` can extend it per-site. This is run PRODUCER-SIDE only
# (snapshot:refresh); the consumer (snapshot:restore, below) never re-sanitizes.
sanitize:
  command: 'vendor/bin/drush sql:sanitize --yes'

# ── Consumer restore (testor#28 snapshot:restore) ─────────────────────────────
# SnapshotImport loads the unpacked dump with `<sql.command> < <file>.sql`.
# `drush sql:cli` opens a client already pointed at the ACTIVE Drupal DB
# connection (resolved from settings.php / settings.local.php), so the restore
# targets whatever database the preview's own settings declare — no host/creds
# are duplicated here. Drush 13.5 (this repo, composer.json `drush/drush: ^13.4`)
# ships `sql:cli`.
sql:
  command: 'vendor/bin/drush sql:cli'

# ── Producer re-export (testor#33/#34 snapshot:refresh -> re-export before push) ──
# After DbSanitize runs in-place against the imported DB, SnapshotRefresh
# re-dumps THAT (now-sanitized) database via `sqldump.command` and pushes the
# re-export, never the original raw pull — this is what makes the #33 fix
# actually push sanitized data instead of short-circuiting forever. Plain
# `drush sql:dump` writes to stdout, which SnapshotCreate redirects to the
# target file itself; no extra flags needed.
sqldump:
  command: 'vendor/bin/drush sql:dump'

# DbUuidNormalize (restore-time, consumer-side) overwrites the restored
# `system.site:uuid` (which carries PROD's uuid) with the TARGET's uuid, so a
# later `drush config:import` from this repo's committed config/default/sync does
# not abort on StorageComparer::validateSiteUuid(). The correct target value is a
# property of THIS repo's config, not of the snapshot: it is the uuid committed
# in config/default/sync/system.site.yml. A fixed per-repo value is right here
# (not one read from the preview) precisely because the preview must converge on
# the repo's committed config. DbUuidNormalize's default command is
# `drush config:set system.site uuid %uuid% -y`, which assumes a global `drush`
# binary on PATH — this repo (and every environment restoring into it, including
# a Flotilla preview container) only has `vendor/bin/drush`, so the default
# fails with "drush: not found" (real-world find, restoring PR #318's preview).
# Override with the project-local binary path, matching `sql.command` above.
uuid:
  value: '4b7619a0-08db-43a2-9bc9-f85e7599ab92'
  command: 'vendor/bin/drush config:set system.site uuid %uuid% -y'
