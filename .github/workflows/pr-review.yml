name: PR-Agent Spec Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  # never cancel a running review from an issue_comment (every comment, incl. /review, triggers a run)
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-review:
    # Local vendored copy of playbook's pr-review-reusable.yml. A PUBLIC repo
    # cannot call a reusable workflow in a PRIVATE one, which is why this is not
    # `uses: Performant-Labs/playbook/...@main` like the private sibling repos.
    # See the header of .github/workflows/pr-review-reusable.yml.
    uses: ./.github/workflows/pr-review-reusable.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
