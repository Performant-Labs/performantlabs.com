name: PR-Agent Spec Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-review:
    # Mirrors the reusable's own job `if` (pr-review-reusable.yml, job `pr-agent`); keep the two
    # identical. It is repeated here so that the job-level `concurrency` below is taken only by a
    # run that will actually review: bot events and comments that are not PR-Agent commands are
    # skipped before they can join the group.
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
       startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/describe') ||
       startsWith(github.event.comment.body, '/improve') ||
       startsWith(github.event.comment.body, '/ask'))
    # On the job, not the workflow. Workflow-level `concurrency` is taken when the run is
    # CREATED, before any job `if`: every PR comment (an ordinary reply, a Tugboat "preview
    # ready") then joined the group and, as the newest pending run, replaced a queued `/review`
    # or push review, and was itself skipped, so that review never ran. On the job, only a run
    # that passes the `if` above takes a slot.
    # Event-scoped cancellation: a push (`synchronize`) cancels a superseded in-flight review,
    # because the new commit makes it stale; a command comment never cancels a running review.
    # Known limit: the group still holds ONE pending run, so a `/describe`, `/improve` or `/ask`
    # posted while a push review is queued displaces that review (its commit status stays
    # missing, not green); post `/review` afterwards. A `/review` that displaces it is harmless:
    # it reviews the current head and posts that commit's status.
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name != 'issue_comment' }}
    # Local vendored copy of playbook's pr-review-reusable.yml. A PUBLIC repo
    # cannot call a reusable workflow in a PRIVATE one, which is why this is not
    # `uses: Performant-Labs/playbook/...@main` like the private sibling repos.
    # See the header of .github/workflows/pr-review-reusable.yml.
    uses: ./.github/workflows/pr-review-reusable.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
